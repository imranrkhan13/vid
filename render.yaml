# Render Blueprint: free web service + free Postgres, both new and isolated.
services:
  - type: web
    name: vgoh
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: vgoh-db, property: connectionString }
      - key: VGOH_MASTER_KEY
        generateValue: true
      - key: VGOH_COOKIE_SECURE
        value: "1"
databases:
  - name: vgoh-db
    plan: free
